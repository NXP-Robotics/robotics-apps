CONFIG_SYNAPSE_ZENOH_PX4_MAG_RATE_HZ=0
CONFIG_SYNAPSE_ZENOH_PX4_GNSS_RATE_HZ=0
# IMU (ICM-45686 topic_imu0) -> px4_msgs SensorCombined for RViz movement
# (and, on a no-local-IMU PX4, a chance to feed single-instance EKF2). ~100 Hz.
CONFIG_SYNAPSE_ZENOH_PX4_SENSOR_COMBINED_RATE_HZ=100

CONFIG_ZENOH_PICO=y
